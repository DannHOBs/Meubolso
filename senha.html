{% extends "base.html" %}

{% block conteudo %}
<form method="post" class="cartao" autocomplete="off">

    <div class="campo">
        <label for="atual">Senha atual</label>
        <input type="password" id="atual" name="atual" required>
    </div>

    <div class="campo">
        <label for="nova">Nova senha</label>
        <input type="password" id="nova" name="nova" minlength="8" required>
        <div class="dica">Pelo menos 8 caracteres, misturando letras e números (ou uma frase curta).</div>
    </div>

    <div class="campo">
        <label for="confirmar">Repita a nova senha</label>
        <input type="password" id="confirmar" name="confirmar" minlength="8" required>
    </div>

    <button type="submit" class="botao botao-bloco">Salvar nova senha</button>

</form>
{% endblock %}
