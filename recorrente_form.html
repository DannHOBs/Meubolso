{% extends "base.html" %}

{% block conteudo %}

<div class="alerta">
    ℹ️ As mudanças valem também para as contas desta recorrência que ainda estão em aberto. As já pagas não mudam.
</div>

<form method="post" class="cartao" autocomplete="off">

    <div class="campo">
        <label for="descricao">O que é?</label>
        <input type="text" id="descricao" name="descricao" maxlength="80" value="{{ form.get('descricao', '') }}" required>
    </div>

    <div class="campo">
        <label for="valor">Valor (R$)</label>
        <input type="text" id="valor" name="valor" inputmode="decimal" value="{{ form.get('valor', '') }}" required>
    </div>

    <div class="campo">
        <label for="categoria_id">Categoria</label>
        <select id="categoria_id" name="categoria_id" required>
            {% for c in categorias %}
                <option value="{{ c.id }}" {% if form.get('categoria_id') == c.id|string %}selected{% endif %}>
                    {{ c.icone }} {{ c.nome }}{% if not c.ativa %} (oculta){% endif %}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="campo">
        <label for="dia">Dia do vencimento (1 a 31)</label>
        <input type="number" id="dia" name="dia" min="1" max="31" value="{{ form.get('dia', '') }}" required>
        <div class="dica">Em meses mais curtos, vence no último dia do mês.</div>
    </div>

    <button type="submit" class="botao botao-bloco">Salvar</button>

</form>

{% endblock %}
