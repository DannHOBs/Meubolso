plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'br.com.meubolso'
    compileSdk 34

    defaultConfig {
        applicationId "br.com.meubolso"
        minSdk 29
        targetSdk 34
        versionCode 4
        versionName "4.0"

        ndk {
            // Celulares atuais (64 bits). Python 3.13 não suporta 32 bits.
            abiFilters "arm64-v8a"
        }
    }

    // Chave de assinatura FIXA: permite instalar versões novas por cima
    // da anterior sem perder os dados do aplicativo.
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storeType "pkcs12"
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"

        pip {
            install "flask==3.1.3"
            install "reportlab==4.4.10"
        }
    }
}
