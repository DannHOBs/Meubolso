name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - "app.py"
      - "banco.py"
      - "backup.py"
      - "templates/**"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: gerar-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Conferir se app.py e templates combinam
        run: python tests/conferir_arquivos.py

      - name: Copiar o sistema para dentro do projeto Android
        run: |
          mkdir -p android/app/src/main/python android/app/src/main/assets
          cp app.py banco.py backup.py android/app/src/main/python/
          rm -rf android/app/src/main/assets/templates
          cp -r templates android/app/src/main/assets/templates
          echo "COMMIT = \"${GITHUB_SHA::7}\"" > android/app/src/main/python/build_info.py
          echo "DATA = \"$(date -u +'%d/%m/%Y %H:%M')\"" >> android/app/src/main/python/build_info.py

      - name: Preparar o Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Instalar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar o APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: MEUBOLSO-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
