{% extends "base.html" %}
{% from "_macros.html" import conta as cartao_conta %}

{% block conteudo %}

<div class="cartao">
    {{ cartao_conta(conta) }}
</div>

<form method="post" class="cartao" autocomplete="off">

    <div class="campo">
        <label for="valor">Valor pago (R$)</label>
        <input type="text" id="valor" name="valor" inputmode="decimal" placeholder="0,00"
               value="{{ form.get('valor', '') }}" required>
        <div class="dica">Mude se o valor veio diferente (luz, água, juros ou desconto).</div>
    </div>

    <div class="campo">
        <label for="data">Data do pagamento</label>
        <input type="date" id="data" name="data" value="{{ form.get('data', '') }}" required>
    </div>

    <button type="submit" class="botao botao-receita botao-bloco">✓ Confirmar pagamento</button>

    <div class="dica" style="text-align: center; margin-top: 10px;">
        A despesa entra nos Lançamentos na data escolhida.
    </div>

</form>

{% endblock %}
