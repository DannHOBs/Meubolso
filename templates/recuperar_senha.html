{% extends "base.html" %}

{% block conteudo %}

<div class="alerta alerta-aviso" style="margin-top: 18px;">
    🔑 Seus dados continuam todos aqui. Só os <strong>backups feitos antes</strong> continuam abrindo com a senha antiga.
</div>

<form method="post" class="cartao" autocomplete="off">

    <div class="campo">
        <label for="nova">Nova senha</label>
        <input type="password" id="nova" name="nova" minlength="8" required autofocus>
        <div class="dica">Pelo menos 8 caracteres, misturando letras e números (ou uma frase curta).</div>
    </div>

    <div class="campo">
        <label for="confirmar">Repita a nova senha</label>
        <input type="password" id="confirmar" name="confirmar" minlength="8" required>
    </div>

    <button type="submit" class="botao botao-bloco">Salvar e entrar</button>

</form>

<div class="dica" style="text-align: center;">Anote a senha nova em um lugar seguro.</div>

{% endblock %}
