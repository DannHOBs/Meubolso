{% extends "base.html" %}

{% block conteudo %}

<div class="alerta">
    💡 Informe quanto você tinha (somando conta e carteira) antes do seu primeiro lançamento no app.
    Assim o "saldo acumulado" do Início bate com o que você tem de verdade.
</div>

<form method="post" class="cartao" autocomplete="off">

    <div class="campo">
        <label for="valor">Saldo inicial (R$)</label>
        <input type="text" id="valor" name="valor" inputmode="decimal" placeholder="0,00"
               value="{{ form.get('valor', '') }}">
        <div class="dica">Deixe em branco ou 0 para começar do zero.</div>
    </div>

    <div class="campo">
        <label style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600;">
            <input type="checkbox" name="negativo" value="1" {% if form.get('negativo') %}checked{% endif %}
                   style="width: 22px; height: 22px;">
            Eu estava no negativo
        </label>
    </div>

    <button type="submit" class="botao botao-bloco">Salvar saldo inicial</button>

</form>

{% endblock %}
